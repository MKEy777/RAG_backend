[database]
url = "sqlite:///./pyrag.db"

[redis]
url = "redis://localhost:6379/0"

[celery]
broker_url = "redis://localhost:6379/1"
result_backend = "redis://localhost:6379/2"

[storage]
profile = "lite"
object_storage_root = "./data/objects"

[llm]
base_url = "http://localhost:8000/v1"
api_key = "sk-placeholder"
chat_model = "qwen3-8b"
embedding_model = "qwen3-embedding-4b"
vlm_model = "qwen3-vl-8b"
rerank_model = "bge-reranker-v2-m3"
rerank_base_url = "http://localhost:8000/v1"

[embedding]
dims = 2560
batch_size = 5
max_chars = 20000
retry_count = 5
retry_base_ms = 200

[chunking]
chunk_size = 512
chunk_overlap = 80
parent_chunk_size = 4096
child_chunk_size = 384
protect_block_limit = 7500

[retrieval]
rrf_k = 60
rrf_vector_weight = 0.7
rrf_keyword_weight = 0.3
embedding_top_k = 50
vector_threshold = 0.15
keyword_threshold = 0.3
rerank_top_k = 10
rerank_threshold = 0.2
wiki_boost = 1.3

[graph]
profile = "lite"
entity_concurrency = 4
relation_concurrency = 4
relation_batch_size = 5
pmi_weight = 0.6
strength_weight = 0.4
two_hop_decay = 0.5
